name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # TODO: add tests and implement this 
      # - name: Run all tests
      #   run: ./backend/run-tests.sh

      - name: Build Docker images
        run: cd backend && docker compose build

      - name: Start all services
        run: cd backend && docker compose up -d

      - name: Wait for services to be healthy
        timeout-minutes: 5
        run: ./backend/wait-for-healthy.sh

      - name: Cleanup
        if: always()
        run: cd backend && docker compose down -v

  cd:
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          cd backend
          
          docker compose down
          docker compose build
          docker compose up -d
          
          sleep 30
          ./backend/wait-for-healthy.sh
          
          docker system prune -f