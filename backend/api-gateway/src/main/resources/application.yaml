server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: deck-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/cards/**, /api/v1/decks/**
