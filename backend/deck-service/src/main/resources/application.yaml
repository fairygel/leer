server:
  port: 8080

spring:
  application:
    name: deck-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/deck
    username: postgres
    password: postgres
  web:
    error:
      include-stacktrace: never
      include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never